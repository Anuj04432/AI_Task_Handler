[project]
name = "to-do-list"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anuj04432", email = "anujwagmore835@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "bcrypt>=4.1.2",
    "dateparser>=1.2.0",
    "pyaudio>=0.2.14",
    "pytest>=8.0.0",
    "pyttsx3>=2.90",
    "requests>=2.31.0",
    "speechrecognition>=3.10.1",
    "streamlit>=1.35.0",
    "streamlit-js-eval>=1.0.0",
]

[project.scripts]
to-do-list = "to_do_list:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
